<article class="news-card">
                        
    <div class="news-image">

        <img [src]="noticia.imagen" [alt]="noticia.titulo">
                    
        <button type ="button" class="favorite-button" [class.active]="esFavorito()" (click)="toggleFavorito()" [attr.aria-label]="esFavorito() ? 'Quitar de favoritos' : 'Agregar a favoritos'"> {{ esFavorito() ? '♥' : '♡' }}</button>
    </div>

     <div class="news-content">

        <div class="news-meta">

            <span class="category">
                {{ noticia.categoria }}
            </span>

            <span class="news-date">
                {{ noticia.fecha }}
            </span>

        </div>


        <h3>
            {{ noticia.titulo }}
        </h3>


        <p class="news-description">
            {{ noticia.descripcion }}
        </p>


        <a class="read-more" [routerLink]="['/noticia', noticia.id]">
            Ver más →
        </a>

    </div>

</article>
